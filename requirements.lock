# Pinned dependency versions for this project.
#
# Generated from a working install on 2026-09-28 (Linux, CPython 3.12, CUDA-less
# GTX 1070 / Vulkan) and verified with the full suite: 166 offline tests, 6
# end-to-end tests against a real whisper-server, and a real two-speaker
# transcription.
#
# Why this file exists: the project declares only lower bounds in pyproject.toml,
# so a fresh `pip install -e ".[dev]"` resolves to whatever is newest that day.
# That has already happened once - a rebuild picked up av 18, numpy 2.5, pytest 9
# and starlette 1.7 at once. It passed, but "whatever is newest" is not a
# reproducible starting point, and PyAV, sherpa-onnx and the FastAPI stack are all
# fast-moving enough to break between two clean installs.
#
# Usage (constraints, so pip still resolves the project itself from pyproject):
#
#     python3 -m venv .venv
#     .venv/bin/pip install -e ".[dev]" -c requirements.lock
#
# The project itself is intentionally absent: it is installed with -e from the
# working tree, not from a pinned artifact.
#
# To refresh after an intentional upgrade, install without -c first, run
# .venv/bin/python -m pytest -q plus tests/test_end_to_end.py, then regenerate.
#
# Not pinned here: the vendored whisper-server binary and the GGML/ONNX model
# weights under vendor/. Those are files, not packages, so they cannot drift.
