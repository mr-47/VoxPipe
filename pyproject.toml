[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxpipe"
version = "1.0.0"
description = "Audio transcription with speaker diarization on whisper.cpp (Vulkan) + sherpa-onnx, with a CLI, folder workflow and REST API"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD-PARTY-NOTICES.md"]
dependencies = [
    # Speech-to-text is the whisper-server *binary*, not a Python package.
    "sherpa-onnx>=1.13.0",   # ONNX speaker diarization (segmentation + embeddings)
    "av>=13.0.0",            # PyAV, for decoding m4a/AAC that whisper.cpp cannot read
    "httpx>=0.27.0",         # client for the internal whisper-server
    "numpy>=1.26.0",
]

[project.optional-dependencies]
# The REST API is optional: watch-only installs skip ~12 MB of web framework.
api = [
    "fastapi>=0.115.0",
    # Plain uvicorn, not [standard]: there is one processing unit and requests
    # queue behind it, so uvloop/httptools cannot raise throughput. Drop them.
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",  # multipart/form-data uploads
    "pydantic>=2.7.0",
]
dev = [
    "voxpipe[api]",  # so `.[dev]` can still run the API tests
    "pytest>=8.0.0",
    "hatchling>=1.25.0",
    "ruff>=0.5.0",
]

[project.scripts]
voxpipe = "voxpipe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voxpipe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # starlette's TestClient warns about httpx vs httpx2; our tests are fine.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
